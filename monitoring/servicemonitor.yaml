apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: securepipeline
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - securepipeline
  selector:
    matchLabels:
      app.kubernetes.io/name: securepipeline
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
# Apply this file after installing kube-prometheus-stack:
# kubectl apply -f monitoring/servicemonitor.yaml
# The release label must match the Helm release name used for Prometheus.
