name: SecurePipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Tests and linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run linting
        run: ruff check .

      - name: Run tests
        run: pytest -q

  container:
    name: Build container image
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t securepipeline:${{ github.sha }} .

      - name: Check image metadata
        run: docker image inspect securepipeline:${{ github.sha }} --format '{{.Config.User}} {{.Config.ExposedPorts}}'
